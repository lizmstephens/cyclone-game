home:{section:'The challenge',title:'Tropical cyclones are one of the most impactful natural hazards globally',body:["Tropical cyclones are one of the most impactful natural hazards globally. Located in the South West Indian Ocean cyclone basin, Madagascar is threatened by two cyclones per year on average, but in some years it can be as many as seven.","Weather forecasts play a critical role in managing the risk posed by these cyclones.","Anticipatory action approaches transform these weather forecasts into lives and livelihoods saved.","The Malagasy Red Cross is one organisation that takes these actions in advance of cyclones to support communities","But how does anticipatory action work?"],buttons:[['Tell me about the forecasts','uncertainty'],['Tell me about the decisions','mobilise']]},
mobilise:{section:'The decisions · 1 of 2',title:'Anticipatory action in Madagascar',body:["The Malagasy Red Cross approach to anticipatory action follows a two-step trigger process.","The first step triggers the mobilisation of resources. The Red Cross has a number of warehouses around the country, they need to mobilise resources in these warehouses to reach an area that could be impacted.","This requires acting at least 5 days before the storm makes landfall, and they do this when a system of tropical storm strength or greater is forecasted.","But they don’t want to act too early, when the forecast might be very uncertain, or not very skillful."],visual:'<figure style="margin:20px 0 0"><img src="data:image/webp;base64,UklGRvAwBABXRUJQVlA4WAoAAAAgAAAA/wcAVAUASUNDUMgBAAAAAAHIAAAAAAQwAABtbnRyUkdCIFhZWiAH4AABAAEAAAAAAABhY3NwAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAQAA9tYAAQAAAADTLQAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAlkZXNjAAAA8AAAACRyWFlaAAABFAAAABRnWFlaAAABKAAAABRiWFlaAAABPAAAABR3dHB0AAABUAAAABRyVFJDAAABZAAAAChnVFJDAAABZAAAAChiVFJDAAABZAAAAChjcHJ0AAABjAAAADxtbHVjAAAAAAAAAAEAAAAMZW5VUwAAAAgAAAAcAHMAUgBHAEJYWVogAAAAAAAAb6IAADj1AAADkFhZWiAAAAAAAABimQAAt4UAABjaWFlaIAAAAAAAACSgAAAPhAAAts9YWVogAAAAAAAA9tYAAQAAAADTLXBhcmEAAAAAAAQAAAACZmYAAPKnAAANWQAAE9AAAApbAAAAAAAAAABtbHVjAAAAAAAAAAEAAAAMZW5VUwAAACAAAAAcAEcAbwBvAGcAbABlACAASQBuAGMALgAgADIAMAAxADZWUDggAi8EADDCFJ0BKgAIVQU+MRiKQ6IhoSckMhrw4AYJZW5QkmW+/We7r/SnOKectwKabijxg1U0WbM5aHSv8R4X/1fg++of630fvS7/3u9M8T6iXmDZx9Hr/z+lt9r9GBlQ3brwLT69H0P/B+Z/+U/bj5x+VfDn4r+M/0v+v/xv/u/0H///Kz/L/8Pu99Zfgf/B/6f9x+V/wOdI/73/I/5z/p/4r////v7X/97/3f8b/g/+r51frb/zf6/94f99///wU/kP9S/0f98/zv/L/xH///+v4r/9f7qfDb/K/9//4ftn8Of7J/mv/D/lv9F/+v9/9MX/a/83+7/f/6Qf2z/ff+j/b/7L/7/Q7/Sf75/4Pz8+e71oP3k///ubfuh/9/+Z7tX/g/cD/ff///0fcX+3P/u/1P+v////n+jn++f9P89f+J9AHr2c//4v/8PPb8q/t/+74m+g/61/Gf6f/u/Ev/S6S/e/A/+efqn+x+1f/l/zv7yfSv/x/3n5cezf5l/V/+j/V/mP8kf5P/Uv99/iv3g/y/7sfYX3t/33+g9ajhvy09CX8t/2/8z/sv2s+J39f/3f6P3A/d/+N/6v9D8CX6/f9r/L/l activate:{section:'The decisions · 2 of 2',title:'Anticipatory action in Madagascar',body:["The Malagasy Red Cross approach to anticipatory action follows a two-step trigger process.","The second step triggers the anticipatory actions within the communities most vulnerable to the storm’s impact. Actions can only be taken in locations where mobilisation has already been triggered.","The trigger threshold is reached when a cyclone with an intensity of 118 km/h or greater is forecasted to make landfall.","They must make this decision at least 48 hours before landfall, because a day before landfall everyone must shelter in place.","This sounds simple, but is it?"],visual:'<figure style="margin:20px 0 0"><img src="data:image/jpeg;base64,/9j/4AAQSkZJRgABAgAAAQABAAD/2wBDAAgGBgcGBQgHBwcJCQgKDBQNDAsLDBkSEw8UHRofHh0aHBwgJC4nICIsIxwcKDcpLDAxNDQ0Hyc5PTgyPC4zNDL/2wBDAQkJCQwLDBgNDRgyIRwhMjIyMjIyMjIyMjIyMjIyMjIyMjIyMjIyMjIyMjIyMjIyMjIyMjIyMjIyMjIyMjIyMjL/wAARCAVVCAADASIAAhEBAxEB/8QAHwAAAQUBAQEBAQEAAAAAAAAAAAECAwQFBgcICQoL/8QAtRAAAgEDAwIEAwUFBAQAAAF9AQIDAAQRBRIhMUEGE1FhByJxFDKBkaEII0KxwRVS0fAkM2JyggkKFhcYGRolJicoKSo0NTY3ODk6Q0RFRkdISUpTVFVWV1hZWmNkZWZnaGlqc3R1dnd4eXqDhIWGh4iJipKTlJWWl5iZmqKjpKWmp6ipqrKztLW2t7i5usLDxMXGx8jJytLT1NXW19jZ2uHi4+Tl5ufo6erx8vP09fb3+Pn6/8QAHwEAAwEBAQEBAQEBAQAAAAAAAAECAwQFBgcICQoL/8QAtREAAgECBAQDBAcFBAQAAQJ3AAECAxEEBSExBhJBUQdhcRMiMoEIFEKRobHBCSMzUvAVYnLRChYkNOEl8RcYGRomJygpKjU2Nzg5OkNERUZHSElKU1RVVldYWVpjZGVmZ2hpanN0dXZ3eHl6goOEhYaHiImKkpOUlZaXmJmaoqOkpaanqKmqsrO0tba3uLm6wsPExcbHyMnK0tPU1dbX2Nna4uPk5ebn6Onq8vP09fb3+Pn6/9oADAMBAAIRAxEAPwD0EgFcetMcAQt9KRG3d6bKcwtj0qozJcblW0kwzCtHTjic/SsWB/matbTj++olswXQ2ZxmLNVatyf6k+tVK5zUKWkFLSGLRRRQAUh6UtB6UgOP8QJl2x6Va8Ngi2ANGvqMk461J4fwbcV2QV4pmMnaVjoU6VJUSHNSCqEOHSigUUAFBoooAQ0opDSikAUUUUAAFFFFAwNMPWn1G3WgBRTxTAeaeKQCinCminCgpBRS0GgYhptONJigQoooFFAhDUZp7nAqOsquxcQooorAsUUUgpaAA0xqfTH6Uhjl6UtMWn0MBRSikFLSGFAoNAoAcKUUgpRSABThSClFABS0lLTEGKSloNAxpqOT7pqQ0xxlakCmnEn41pp9wVnBfnrQT7g+ldVN+6YyWo6lFHeitSQFOFNpwq4kyEPSmfxVIelRkc uncertainty:{section:'The forecasts · 1 of 2',title:'The first thing you will need to know:',body:["Weather forecasts of the track and intensity of a tropical cyclone are inherently uncertain, and this uncertainty is greater the further ahead in the future you are trying to look.","Weather forecasters use ensemble forecasts to represent this uncertainty. An ensemble forecast is run multiple times with slightly different starting conditions.","Each of those individual members grouped together tells us how confident we can be in our predictions.","As a simplified example, when most of the ensemble members point towards rain, then the forecast is more confident it will rain."],visual:'<div style="display:grid;gap:10px"><img src="ensemble-9-1-meandering.svg" alt="Nine ensemble members predict rain and one predicts sunshine" style="display:block;width:100%;height:auto;border:2px solid #173e51;border-radius:5px"><img src="ensemble-5-5-meandering.svg" alt="Five ensemble members predict rain and five predict sunshine" style="display:block;width:100%;height:auto;border:2px solid #173e51;border-radius:5px"></div>',buttons:[['Take a look at one of these forecasts','jokwe']]},
jokwe:{section:'The forecasts · 2 of 2',title:'Let’s look at the forecasts used in this game',body:["Each line represents a different ensemble member, and the colours indicate the forecast intensity of the storm.","Notice how closely the tracks are grouped together as the storm approaches Madagascar, but how much they spread out further into the forecast.","Although we can be fairly confident that the storm will approach northern Madagascar, there is still uncertainty about exactly where it will go and how strong it will be.","Can you see how difficult it might be to decide where and when to take action?"],visual:'<svg id="jokwe-map" viewBox="0 0 800 520" role="img" aria-label="Example ensemble forecast, Equal Earth projection" style="display:block;width:100%;height:auto;background:#dfeff7;border-radius:7px"></svg><div style="display:flex;flex-wrap:wrap;gap:8px 15px;margin:12px 0;font-size:12px;color:#445e68"><span style="color:#277c9d">● &lt;63 km/h</span><span style="color:#17836d">● 63–88</span><span style="color:#a38313">● 89–117</span><span style="color:#c76d24">● 118–165</span><span style="color:#b32f35">● ≥166</span></div>',buttons:[['Tell me about the decisions','mobilise'],['Let’s play','ready']]},
ready:{section:'Your turn',title:'Let’s Play!',body:["Let’s work our way together through one storm.","It’s now the cyclone season, and the Madagascar Red Cross have undertaken their seasonal readiness activities. Warehouses are fully stocked and staff and volunteers are trained."],buttons:[['Let’s go!','freddy']],visual:'<svg id="warehouse-map" viewBox="0 0 440 480" role="img" aria-label="Madagascar map showing the six game warehouse locations"></svg>'},
freddy:{section:'Guided storm',title:'Cyclone Freddy',body:[],visual:'<p><a class="button secondary" href="'+daily+'" target="_blank" rel="noopener">Open the daily forecast catalogue</a></p><p class="draft">Prototype placeholder: guided Freddy gameplay with annotations highlighting the relevant forecast and decision controls. No decisions are recorded here yet.</p>',buttons:[['What did we learn?','freddyLearn']]},
freddyLearn:{section:'Reflection',title:'What did we learn?',body:["Cyclone Freddy was well forecasted. We knew where the storm would make landfall with relatively high confidence quite far in advance.","With a forecast like this we can mobilise and take action in right areas before the storm!","But let’s try a different storm:"],buttons:[['Play another storm','chido']]},
chido:{section:'Your turn',title:'Cyclone Chido',body:[],visual:'<p><a class="button secondary" href="'+daily+'" target="_blank" rel="noopener">Open the daily forecast catalogue</a></p><p class="draft">Prototype placeholder: independent Chido gameplay. No decisions are recorded here yet.</p>',buttons:[['What did we learn?','chidoLearn']]},
chidoLearn:{section:'Reflection',title:'What did we learn?',body:["OK, Chido was an extremely impactful storm, but in Mayotte and Mozambique, not so much in Madagascar?","The forecasts suggested you should mobilise, did you?","Sometimes something can be the right decision, even if the storm didn’t go on to be impactul."],note:'Draft: confirm the Madagascar impacts and the mobilisation forecast against the scenario catalogue.',buttons:[]}
};

 const inside=(p,ring)=>{let yes=false;for(let i=0,j=ring.length-1;i<ring.length;j=i++){const a=ring[i],b=ring[j];if((a[1]>p[1])!==(b[1]>p[1])&&p[0]<(b[0]-a[0])*(p[1]-a[1])/(b[1]-a[1])+a[0])yes=!yes}return yes};
 Promise.all([archivePromise,homeReady]).then(([archive,ready])=>{
 if(token!==animationToken||!ready)return;
 let active=[],finished=[],lastSpawn=-Infinity,previous=-1;

 if(home)pts=edgeEntry(pts);const g=make('g',{}),p=make('path',{d:smoothPath(pts),fill:'none',stroke:colors[index%colors.length],'stroke-width':home?2.5:2,'stroke-linecap':'round','stroke-linejoin':'round',opacity:home?.85:.4},g);
 let length=p.getTotalLength();if(!length){g.remove();return}if(home){const coast=rings.map(r=>r.map(q=>project(...q)));const total=length;for(let l=0;l<=total;l+=1){const q=p.getPointAtLength(l);if(coast.some(r=>inside([q.x,q.y],r))){length=l;break}}if(length<8){g.remove();return}}

 }
 function frame(ts){

 for(const a of active){const t=Math.min(1,(ts-a.start)/a.duration);a.p.style.strokeDashoffset=a.length*(1-t);const q=a.p.getPointAtLength(a.length*t);a.symbol.setAttribute('transform','translate('+q.x+' '+q.y+') rotate('+ts/24+')');if(t===1){a.symbol.remove();if(home)a.g.remove();else finished.push(a.g)}}
 active=active.filter(a=>ts-a.start<a.duration);
 while(finished.length>5)finished.shift().remove();

 animationFrame=requestAnimationFrame(frame);
 }
 if(reduced){spawn(0);for(const a of active){a.p.style.strokeDashoffset=0;a.symbol.remove()}}else animationFrame=requestAnimationFrame(frame);
 }).catch(()=>{});
}
